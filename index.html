<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>图片</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      background: #141414;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }

    .stage {
      position: relative;
      flex: none;
      width: min(calc(100vw - 32px), calc(max(180px, 100dvh - 112px) * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
    }

    img {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-touch-callout: default;
    }

    img.show { display: block; }

    button {
      width: min(calc(100vw - 32px), calc(max(180px, 100dvh - 112px) * 16 / 9));
      height: 48px;
      border: 0;
      border-radius: 8px;
      background: #f4f4f4;
      color: #141414;
      font: 600 16px/1 inherit;
    }

    button:disabled {
      background: #2a2a2a;
      color: #8a8a8a;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img id="photo" alt="">
  </div>
  <button id="save" type="button" disabled>保存到本地</button>
  <script>
    var photo = document.getElementById("photo");
    var saveButton = document.getElementById("save");
    var currentUrl = "";
    var readyFile = null;
    var prepareState = "idle";

    function requested() {
      var href = location.href;
      var queryAt = href.indexOf("?");
      var hashAt = href.indexOf("#");
      var search = "";
      if (queryAt !== -1) {
        var end = hashAt > queryAt ? hashAt : href.length;
        search = href.slice(queryAt + 1, end);
      }
      if (/^https?:\/\//i.test(search)) return search;
      if (/^https?%3A/i.test(search)) return safeDecode(search);
      var params = new URLSearchParams(search);
      var names = ["url", "src", "img", "image"];
      for (var i = 0; i < names.length; i++) {
        var value = params.get(names[i]);
        if (value && value.trim()) return value.trim();
      }
      var key = params.get("key") || params.get("path");
      if (key && key.trim()) return location.origin + "/" + key.trim().replace(/^\/+/, "");
      var hash = hashAt === -1 ? "" : href.slice(hashAt + 1);
      if (/^https?%3A/i.test(hash)) hash = safeDecode(hash);
      if (/^https?:\/\//i.test(hash)) return hash;
      if (hash) return location.origin + "/" + hash.replace(/^\/+/, "");
      return "";
    }

    function safeDecode(value) {
      try { return decodeURIComponent(value); } catch (error) { return value; }
    }

    function accepted(value) {
      if (!value || value.length > 16000) return false;
      try {
        var url = new URL(value);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (error) {
        return false;
      }
    }

    function sanitize(name) {
      var clean = name.replace(/[\u0000-\u001f\\/:*?"<>|]/g, "_").trim().slice(0, 180);
      return clean || "image";
    }

    function filenameFromUrl(url) {
      try {
        var base = new URL(url).pathname.split("/").filter(Boolean).pop() || "image";
        return sanitize(safeDecode(base));
      } catch (error) {
        return "image";
      }
    }

    function extensionFor(type) {
      var map = {
        "image/jpeg": ".jpg",
        "image/png": ".png",
        "image/webp": ".webp",
        "image/gif": ".gif",
        "image/avif": ".avif",
        "image/bmp": ".bmp",
        "image/svg+xml": ".svg"
      };
      return map[String(type || "").split(";")[0].trim().toLowerCase()] || "";
    }

    function ensureExtension(name, type) {
      if (/\.[A-Za-z0-9]{2,5}$/.test(name)) return name;
      return name + (extensionFor(type) || ".jpg");
    }

    function triggerDownload(href, name) {
      var link = document.createElement("a");
      link.href = href;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function prepare(url) {
      prepareState = "idle";
      fetch(url, { mode: "cors", credentials: "omit" }).then(function (response) {
        if (!response.ok) throw new Error(String(response.status));
        return response.blob().then(function (blob) {
          if (currentUrl !== url) return;
          var name = ensureExtension(filenameFromUrl(url), blob.type);
          readyFile = new File([blob], name, { type: blob.type || "image/jpeg" });
          prepareState = "ok";
          saveButton.disabled = false;
        });
      }).catch(function () {
        if (currentUrl !== url) return;
        readyFile = null;
        prepareState = "fail";
        saveButton.disabled = !(photo.complete && photo.naturalWidth > 0);
      });
    }

    function save() {
      if (saveButton.disabled || !currentUrl) return;
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (ios && readyFile && navigator.canShare && navigator.canShare({ files: [readyFile] })) {
        navigator.share({ files: [readyFile] }).catch(function (error) {
          if (error && error.name === "AbortError") return;
          downloadReady();
        });
        return;
      }
      downloadReady();
    }

    function downloadReady() {
      if (readyFile) {
        var objectUrl = URL.createObjectURL(readyFile);
        triggerDownload(objectUrl, readyFile.name);
        setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 4000);
        return;
      }
      triggerDownload(currentUrl, ensureExtension(filenameFromUrl(currentUrl), ""));
    }

    function show(url) {
      if (!accepted(url)) return;
      currentUrl = url;
      readyFile = null;
      saveButton.disabled = true;
      photo.className = "";
      photo.onload = function () {
        if (currentUrl !== url) return;
        photo.className = "show";
        if (prepareState === "fail") saveButton.disabled = false;
      };
      photo.onerror = function () {
        if (currentUrl !== url) return;
        photo.className = "";
        if (prepareState !== "ok") saveButton.disabled = true;
      };
      photo.src = url;
      prepare(url);
    }

    saveButton.addEventListener("click", save);
    var initial = requested();
    if (initial) show(initial);
  </script>
</body>
</html>
